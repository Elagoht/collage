{{with .Article}}
<article class="piece">
  <header class="piece-head">
    <p class="kicker"><a href="{{$.URL.Category .Category}}">{{.Category}}</a></p>
    <h1>{{.Title}}</h1>
    <p class="dek">{{.Dek}}</p>
    <p class="byline">
      {{if eq $.Locale "tr"}}Yazan{{else}}By{{end}}
      <a href="{{$.URL.Author .Author}}">{{.Author}}</a> ·
      <time datetime="{{formatTime .PublishedAt "2006-01-02"}}">{{formatTime .PublishedAt "2 January 2006"}}</time> ·
      {{.ReadMinutes}} min
    </p>
  </header>
  <div class="prose">
    {{range .Body}}<p>{{.}}</p>{{end}}
  </div>
  <footer class="tags">
    {{range .Tags}}<a href="{{$.URL.Search}}?q={{.}}" class="tag">{{.}}</a>{{end}}
  </footer>
</article>
{{end}}
