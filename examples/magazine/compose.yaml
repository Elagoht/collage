# The magazine, both halves, wired together.
#
#   docker compose --project-directory ../.. -f compose.yaml up --build
#
# The build context is the repository root because both binaries import the shared
# newsroom package, which sits outside this directory.

services:
  api:
    build:
      context: ../..
      dockerfile: examples/magazine/Dockerfile
      args:
        CMD: api
    environment:
      LOG_LEVEL: info
      # Uncomment to watch the site's degraded paths:
      # MAGAZINE_API_FAIL_EVERY: "3"
      # MAGAZINE_API_LATENCY: 400ms
    ports:
      - "8080:8080"

  site:
    build:
      context: ../..
      dockerfile: examples/magazine/Dockerfile
      args:
        CMD: site
    environment:
      PORT: "3000"
      MAGAZINE_API_URL: http://api:8080
      PUBLIC_BASE_URL: http://localhost:3000
      CACHE_TTL: 5m
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - api
