# The gate the framework has to pass before anyone depends on a commit.
#
# Separate jobs rather than one, because they answer different questions and a
# reader looking at a red tick should not have to guess which: does the framework
# hold, is it free of the mistakes a linter and the vulnerability database know
# about, and do the published plugins' releases still build and pass their tests
# against what is about to become a tag.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # By hand, to ask the plugins' question before tagging rather than after.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    name: framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Formatting first: it is the cheapest failure and the one most likely to
      # bury a real diff in noise if it lands.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race is the point of this job, not an extra. The framework renders
      # concurrently and caches shared state; a suite that only ever runs
      # single-threaded would pass through exactly the bugs that matter here.
      - name: go test -race
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Pinned, so a new release of a tool cannot turn a commit red that was
      # green yesterday without anything in this repository changing.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      # Deliberately not pinned to a database snapshot: a vulnerability published
      # today in the standard library or a dependency should fail today's build.
      # It reports only what the code actually calls, so an advisory in a corner
      # of a package this never reaches is not a failure.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  bench:
    name: bench
    runs-on: ubuntu-latest
    # Tags only, like plugins: what a release costs per request against the one
    # before it. Reported, not enforced. A shared runner's timings are noisy
    # enough that a gate would go red on the machine rather than on the code;
    # the summary is there to be read before the release notes are written.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: benchmarks, this commit
        run: go test -run='^$' -bench=. -benchmem -count=6 ./... | tee "$RUNNER_TEMP/new.txt"

      # The previous tag's own benchmarks, run on the same runner a moment
      # later; a release older than the benchmarks has none, and the summary is
      # then this commit's numbers alone.
      - name: benchmarks, previous tag
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "previous=$previous" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/old.txt"
          if [ -n "$previous" ]; then
            git worktree add -q "$RUNNER_TEMP/previous" "$previous"
            (cd "$RUNNER_TEMP/previous" && go test -run='^$' -bench=. -benchmem -count=6 ./... > "$RUNNER_TEMP/old.txt" || true)
          fi

      - name: benchstat
        run: |
          {
            echo "## Benchmarks against ${previous:-no previous tag}"
            echo '```'
            if [ -s "$RUNNER_TEMP/old.txt" ]; then
              go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260929162123-406019bb8b68 "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
            else
              go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260929162123-406019bb8b68 "$RUNNER_TEMP/new.txt"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plugins:
    name: plugins
    runs-on: ubuntu-latest
    # Tags only: the question is whether this release is one the published
    # plugins can still build against. Published means tagged — a plugin's main
    # branch is not what anyone installs, and a fix sitting there untagged would
    # turn this green while every user still has the broken release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Every published plugin. A plugin added under github.com/Elagoht is added
    # here too; one left out is one a release can break without anyone seeing.
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - collage-accesslog
          - collage-analytics
          - collage-basicauth
          - collage-bundle
          - collage-cdnpurge
          - collage-compress
          - collage-deploy
          - collage-devtoolbar
          - collage-errortrack
          - collage-fail2ban
          - collage-favicon
          - collage-feed
          - collage-flash
          - collage-health
          - collage-highlight
          - collage-honeypot
          - collage-htmlcheck
          - collage-i18n
          - collage-indexnow
          - collage-jobs
          - collage-jsonld
          - collage-live
          - collage-markdown
          - collage-meta
          - collage-minimizer
          - collage-oauth
          - collage-offline
          - collage-ogimage
          - collage-opti-image
          - collage-otel
          - collage-prometheus
          - collage-ratelimit
          - collage-redirects
          - collage-robots
          - collage-search
          - collage-secure
          - collage-session
          - collage-sitemap
          - collage-tenant
          - collage-toc
          - collage-validate
          - collage-websocket
    steps:
      - uses: actions/checkout@v4
        with:
          path: collage
      - uses: actions/checkout@v4
        with:
          repository: Elagoht/${{ matrix.plugin }}
          path: ${{ matrix.plugin }}
          fetch-depth: 0
          fetch-tags: true

      # The plugin's latest release, by version order. A plugin with no release
      # is a failure rather than a skip: it is listed here as published.
      - name: check out the latest release
        working-directory: ${{ matrix.plugin }}
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo "${{ matrix.plugin }} has no release tag"
            exit 1
          fi
          echo "testing ${{ matrix.plugin }} $tag"
          git checkout --quiet "$tag"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # A workspace rather than a replace directive: it leaves the plugin's own
      # go.mod untouched, so what is tested is the release as published, merely
      # resolved against the collage being released.
      - name: build and test against this collage
        working-directory: ${{ matrix.plugin }}
        run: |
          go work init . ../collage
          go build ./...
          go test ./...
